name: Code Quality (OCA Pre-commit)

on:
  push:
    branches:
      - "18.0"
  pull_request:
    branches:
      - "18.0"

jobs:
  pre-commit:
    name: Code Quality (OCA Pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.1

