name: Code Quality (OCA Pre-commit)

on:
  push:
    branches:
      # migracion_19_20: the pre-commit job also runs on the 20.0 branch.
      - "20.0"
      - "19.0"
      - "18.0"
  pull_request:
    branches:
      # migracion_19_20: the pre-commit job also runs on the 20.0 branch.
      - "20.0"
      - "19.0"
      - "18.0"

jobs:
  pre-commit:
    name: Code Quality (OCA Pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.1
